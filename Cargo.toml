[package]
name = "mkv_remuxer"
version = "0.1.0"
edition = "2024"

[dependencies]
mkv-element = { version = "0.3", features = ["utils"] }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
uuid = { version = "1.3", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
log4rs = "1.3"