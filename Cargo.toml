[package]
name = "mkv_remuxer"
version = "0.1.0"
edition = "2024"

[dependencies]
mkv-element = { version = "0.3", features = ["utils"] }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
uuid = { version = "1.3", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
log4rs = "1.3"
warp = "0.3.7"
tokio = { version = "1.39.3", features = ["rt", "rt-multi-thread", "macros", "full"] }
tokio-stream = "0.1.17"
bytes = "1.7.1"
futures-util = "0.3.30"

[dev-dependencies]
env_logger = "0.11"