<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced MKV Remuxer Demo</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .controls { margin-top: 10px; border: 1px solid #ccc; padding: 10px; background: #f9f9f9; }
        .control-group { margin-bottom: 10px; }
        label { display: inline-block; width: 100px; font-weight: bold; }
        select { width: 300px; }
        video { width: 100%; background: #000; }
        #statusBar { margin-top: 10px; font-size: 0.9em; color: #555; }
    </style>
</head>
<body>
    <h1>MKV Remuxer Advanced Player</h1>
    
    <video id="videoPlayer" controls playsinline></video>
    
    <div class="controls">
        <div class="control-group">
            <label>Video Track:</label>
            <select id="videoTrackSelect"></select>
        </div>
        
        <div class="control-group">
            <label>Audio Track:</label>
            <select id="audioTrackSelect"></select>
        </div>
        
        <div class="control-group">
            <label>Subtitle:</label>
            <select id="subtitleTrackSelect">
                <option value="-1">None</option>
            </select>
        </div>

        <div class="control-group">
            <label>Seek:</label>
            <input type="range" id="seekBar" min="0" max="100" step="1" style="width: 300px;">
            <span id="timeDisplay">00:00 / 00:00</span>
            <button id="seekBtn">Go</button>
        </div>
    </div>

    <div id="statusBar">Loading...</div>

    <script src="didiPlayer.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const video = document.getElementById('videoPlayer');
            const player = new DidiPlayer(video);
            
            // UI References
            const videoSelect = document.getElementById('videoTrackSelect');
            const audioSelect = document.getElementById('audioTrackSelect');
            const subSelect = document.getElementById('subtitleTrackSelect');
            const seekBar = document.getElementById('seekBar');
            const timeDisplay = document.getElementById('timeDisplay');
            const status = document.getElementById('statusBar');

            // Load Metadata
            try {
                await player.loadlibs();
                status.textContent = "Loaded " + player.files.length + " files.";
                
                // Populate Video Track Select
                initTrackUI();

            } catch (e) {
                status.textContent = "Error: " + e.message;
            }

            function initTrackUI() {
                videoSelect.innerHTML = '';
                const vTracks = player.getAllVideoTracks();
                vTracks.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = JSON.stringify({id: t.track_id, fileIdx: t.fileIndex});
                    opt.textContent = `[${t.fileName}] ID ${t.track_id}: ${t.codec} ${t.width}x${t.height}`;
                    videoSelect.appendChild(opt);
                });
                
                if (vTracks.length > 0) {
                    const first = vTracks[0];
                    videoSelect.value = JSON.stringify({id: first.track_id, fileIdx: first.fileIndex});
                    handleVideoChange(first.track_id, first.fileIndex);
                }
            }

            function handleVideoChange(trackId, fileIndex) {
                 player.setVideoTrack(trackId, fileIndex);
                 updateSecondaryTracksUI(fileIndex);
                 status.textContent = "Playing video from file " + fileIndex;
            }

            function updateSecondaryTracksUI(fileIndex) {
                // Audio (Smart Filter)
                audioSelect.innerHTML = '';
                const aTracks = player.getAudioTracks(fileIndex);
                aTracks.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = JSON.stringify({id: t.track_id, fileIdx: t.fileIndex});
                    const origin = t.origin === 'external' ? ` [Ext File ${t.fileIndex}]` : '';
                    opt.textContent = `ID ${t.track_id}: ${t.codec} (${t.language || 'und'})${origin}`;
                    audioSelect.appendChild(opt);
                });

                if (aTracks.length > 0) {
                    // Pre-select what the player decided
                    audioSelect.value = JSON.stringify({id: player.activeAudioTrackId, fileIdx: player.activeAudioFileIndex});
                }

                // Subtitle (Smart Selector)
                subSelect.innerHTML = '<option value="-1">None</option>';
                const subCandidates = player.getSubtitleTracks();
                
                subCandidates.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = JSON.stringify({id: t.track_id, fileIdx: t.fileIndex});
                    const forced = t.forced ? ' [Forced]' : '';
                    const size = `(${(t.fileSize/1024).toFixed(0)}KB)`;
                    opt.textContent = `${t.language || 'und'}${forced} ${size}`;
                    subSelect.appendChild(opt);
                });
            }

            // Event Listeners
            videoSelect.addEventListener('change', (e) => {
                const val = JSON.parse(e.target.value);
                handleVideoChange(val.id, val.fileIdx);
            });

            audioSelect.addEventListener('change', (e) => {
                const val = JSON.parse(e.target.value);
                player.selectAudio(val.id, val.fileIdx);
                // Also trigger playback to apply new audio track
                player.seek(video.currentTime);
            });

            subSelect.addEventListener('change', (e) => {
                if (e.target.value === "-1") {
                    player.activeSubtitleTrackId = -1;
                    player.reloadSubtitles();
                    return;
                }
                const val = JSON.parse(e.target.value);
                player.selectSubtitle(val.id, val.fileIdx);
            });

            document.getElementById('seekBtn').addEventListener('click', () => {
                const perc = seekBar.value;
                const duration = player.getDuration();
                const sec = (perc / 100) * duration;
                player.seek(sec);
            });
            
            video.addEventListener('timeupdate', () => {
                const duration = player.getDuration();
                const currentRel = video.currentTime;
                const absTime = player.isSafari ? currentRel : (currentRel + (player.currentSeekOffset || 0));
                
                if (duration > 0) {
                    seekBar.value = (absTime / duration) * 100;
                    timeDisplay.textContent = formatTime(absTime) + " / " + formatTime(duration);
                }
            });

            function formatTime(s) {
                const m = Math.floor(s / 60);
                const sec = Math.floor(s % 60);
                return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
            }
        });
    </script>
</body>
</html>
